name: Build Electron App

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options:
          - windows
          - macos
          - both

permissions:
  contents: read

jobs:
  build-windows:
    if: inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run electron:package:win
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    if: inputs.platform == 'macos' || inputs.platform == 'both'
    runs-on: macos-latest
    environment: Production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Build, sign, and notarize macOS app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing signing or notarization secret: ${name}"
              exit 1
            fi
          done
          bun run electron:package:mac
      - name: Verify macOS signature and notarization
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/*.app)
          if (( ${#apps[@]} == 0 )); then
            echo "::error::No packaged macOS app was found."
            exit 1
          fi
          for app in "${apps[@]}"; do
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose "$app"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-build
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-build"
          merge-multiple: true
          path: release/
      - name: Create draft desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(jq -er '.version | strings | select(length > 0)' apps/desktop/package.json)"
          tag="v${version}"
          git check-ref-format "refs/tags/${tag}"
          shopt -s nullglob
          installers=(release/*.exe release/*.dmg release/*.zip)
          if (( ${#installers[@]} == 0 )); then
            echo "::error::No desktop installers were downloaded."
            exit 1
          fi
          gh api --method POST "repos/${GH_REPO}/git/refs" \
            -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}" --silent
          gh release create "$tag" "${installers[@]}" \
            --draft --verify-tag \
            --title "Blackhole Audio Visualizer ${version}" --generate-notes
